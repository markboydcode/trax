<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Transparent canvas with content inset for macOS icon guidelines -->

  <!-- Left bell -->
  <ellipse cx="300" cy="250" rx="110" ry="90" fill="#4A4A4A" transform="rotate(-25 300 250)"/>
  <!-- Right bell -->
  <ellipse cx="724" cy="250" rx="110" ry="90" fill="#4A4A4A" transform="rotate(25 724 250)"/>

  <!-- Left bell highlight -->
  <ellipse cx="290" cy="235" rx="80" ry="60" fill="#5C5C5C" transform="rotate(-25 290 235)"/>
  <!-- Right bell highlight -->
  <ellipse cx="734" cy="235" rx="80" ry="60" fill="#5C5C5C" transform="rotate(25 734 235)"/>

  <!-- Clock body shadow -->
  <circle cx="512" cy="520" r="310" fill="#3A3A3A"/>
  <!-- Clock body -->
  <circle cx="512" cy="512" r="310" fill="#4A4A4A"/>
  <!-- Clock body rim -->
  <circle cx="512" cy="512" r="290" fill="#555555"/>

  <!-- Clock face -->
  <circle cx="512" cy="512" r="270" fill="#F5F0E8"/>
  <!-- Inner ring -->
  <circle cx="512" cy="512" r="255" fill="none" stroke="#DDDDCC" stroke-width="2"/>

  <!-- Hour markers -->
  <!-- 12 -->
  <rect x="504" y="260" width="16" height="40" rx="4" fill="#4A4A4A"/>
  <!-- 1 -->
  <rect x="504" y="260" width="16" height="40" rx="4" fill="#4A4A4A" transform="rotate(30 512 512)"/>
  <!-- 2 -->
  <rect x="504" y="260" width="16" height="40" rx="4" fill="#4A4A4A" transform="rotate(60 512 512)"/>
  <!-- 3 -->
  <rect x="504" y="260" width="16" height="40" rx="4" fill="#4A4A4A" transform="rotate(90 512 512)"/>
  <!-- 4 -->
  <rect x="504" y="260" width="16" height="40" rx="4" fill="#4A4A4A" transform="rotate(120 512 512)"/>
  <!-- 5 -->
  <rect x="504" y="260" width="16" height="40" rx="4" fill="#4A4A4A" transform="rotate(150 512 512)"/>
  <!-- 6 -->
  <rect x="504" y="260" width="16" height="40" rx="4" fill="#4A4A4A" transform="rotate(180 512 512)"/>
  <!-- 7 -->
  <rect x="504" y="260" width="16" height="40" rx="4" fill="#4A4A4A" transform="rotate(210 512 512)"/>
  <!-- 8 -->
  <rect x="504" y="260" width="16" height="40" rx="4" fill="#4A4A4A" transform="rotate(240 512 512)"/>
  <!-- 9 -->
  <rect x="504" y="260" width="16" height="40" rx="4" fill="#4A4A4A" transform="rotate(270 512 512)"/>
  <!-- 10 -->
  <rect x="504" y="260" width="16" height="40" rx="4" fill="#4A4A4A" transform="rotate(300 512 512)"/>
  <!-- 11 -->
  <rect x="504" y="260" width="16" height="40" rx="4" fill="#4A4A4A" transform="rotate(330 512 512)"/>

  <!-- Hour hand (pointing to 10) -->
  <rect x="502" y="340" width="20" height="185" rx="10" fill="#333333" transform="rotate(-60 512 512)"/>

  <!-- Minute hand (pointing to 2) -->
  <rect x="504" y="290" width="16" height="235" rx="8" fill="#333333" transform="rotate(60 512 512)"/>

  <!-- Second hand -->
  <rect x="510" y="280" width="4" height="250" rx="2" fill="#CC3333" transform="rotate(120 512 512)"/>

  <!-- Center cap -->
  <circle cx="512" cy="512" r="18" fill="#333333"/>
  <circle cx="512" cy="512" r="10" fill="#CC3333"/>

  <!-- Left foot -->
  <rect x="310" y="790" width="30" height="80" rx="10" fill="#4A4A4A" transform="rotate(20 325 830)"/>
  <!-- Right foot -->
  <rect x="684" y="790" width="30" height="80" rx="10" fill="#4A4A4A" transform="rotate(-20 699 830)"/>

  <!-- Hammer on top -->
  <rect x="504" y="175" width="16" height="60" rx="5" fill="#4A4A4A"/>
  <circle cx="512" cy="175" r="20" fill="#4A4A4A"/>
</svg>